name: ailog
description: >-
  Structured JSONL logging designed to be read by an AI. Trace correlation,
  causal chains embedded in error lines, error fingerprinting, automatic
  secret redaction and a digest CLI — with zero dependencies.
version: 0.3.0
repository: https://github.com/FuruyamaMasayuki/ai-readable-logs
publish_to: none

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

executables:
  ailog_digest: ailog_digest
