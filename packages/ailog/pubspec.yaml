name: ailog
description: >-
  Structured JSONL logging designed to be read by an AI. Trace correlation,
  causal chains, error fingerprinting, secret redaction and a digest CLI.
  Zero dependencies.
version: 0.4.0
repository: https://github.com/FuruyamaMasayuki/ai-readable-logs
issue_tracker: https://github.com/FuruyamaMasayuki/ai-readable-logs/issues

topics:
  - logging
  - logs
  - observability
  - ai
  - jsonl

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

executables:
  ailog_digest: ailog_digest
