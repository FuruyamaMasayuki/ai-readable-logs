name: ailog_vault
description: >-
  Share ailog output through log_vault: one tap sends the JSONL log and an
  AI-ready digest as a zip via the platform share sheet.
version: 0.1.0
repository: https://github.com/FuruyamaMasayuki/ai-readable-logs
issue_tracker: https://github.com/FuruyamaMasayuki/ai-readable-logs/issues

topics:
  - logging
  - logs
  - share
  - ai

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  ailog: ^0.4.0
  flutter:
    sdk: flutter
  log_vault: ^0.1.1
  path: ^1.9.0
  path_provider: ^2.1.6
  share_plus: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
