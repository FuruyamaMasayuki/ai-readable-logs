name: ailog_flutter
description: >-
  Flutter add-on for ailog: automatic error hooks, navigation breadcrumbs,
  and a bridge so native Kotlin/Swift code logs into the same JSONL file.
version: 0.3.0
repository: https://github.com/FuruyamaMasayuki/ai-readable-logs
issue_tracker: https://github.com/FuruyamaMasayuki/ai-readable-logs/issues

topics:
  - logging
  - logs
  - observability
  - ai
  - crash-reporting

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  ailog: ^0.4.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.ailog.ailog_flutter
        pluginClass: AilogFlutterPlugin
      ios:
        pluginClass: AilogFlutterPlugin
