name: ailog_flutter
description: >-
  Flutter add-on for ailog. Automatic FlutterError/PlatformDispatcher/
  ErrorWidget hooks, navigation breadcrumbs, and a bridge that lets native
  iOS/Android (Kotlin/Swift) code log into the same JSONL output.
version: 0.2.0
repository: https://github.com/FuruyamaMasayuki/ai-readable-logs
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  ailog:
    path: ../ailog
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.ailog.ailog_flutter
        pluginClass: AilogFlutterPlugin
      ios:
        pluginClass: AilogFlutterPlugin
