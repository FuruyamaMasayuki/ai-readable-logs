name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ailog:
    name: ailog (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ailog
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      # Covers tool/documented_api_check.dart, which references every API the
      # READMEs document — so an example that drifted from the code (a
      # renamed method, a removed parameter) fails the build instead of
      # shipping. A README is not compiled; that file is.
      - run: dart analyze --fatal-infos
      - run: dart test
      # Guards web support, which `dart analyze` and `dart test` both miss:
      # a 64-bit int literal is a hard dart2js compile error, and one sat in
      # ids.dart making the whole package unbuildable for web without any
      # other check noticing.
      - run: dart compile js tool/web_entry.dart -o /tmp/ailog_web.js
      - run: dart doc --validate-links
      # Both CLIs must at least start and print usage. `dart test` never
      # executes bin/, so a broken entry point would otherwise ship.
      - run: dart run ailog:ailog_digest --help
      - run: dart run ailog:ailog_sync --help
      - run: dart pub publish --dry-run

  ailog_flutter:
    name: ailog_flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ailog_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run
